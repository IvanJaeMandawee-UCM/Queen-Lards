<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Queen's Lards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
   <link rel="icon" type="image/png" href="{{ url_for('static', filename='Queen-Lards-Logo.png') }}">
</head>
<body class="auth-page">

  <div class="auth-back">
    <a href="{{ url_for('index') }}">&larr; Queen's Lards</a>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to see what everyone's shared.</p>

      <form method="POST" action="{{ url_for('login') }}" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
        </div>

        <div class="field-row">
          <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
        </div>

        {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="auth-alt">
        New here? <a href="{{ url_for('signup') }}">Create an account</a>
      </p>
    </div>
  </div>

</body>
</html>
