<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up · Queen's Lards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

  <div class="auth-back">
    <a href="{{ url_for('index') }}">&larr; Queen's Lards</a>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Join the family page</h1>
      <p class="auth-sub">Create an account to start adding photos and stories.</p>

      <form method="POST" action="{{ url_for('signup') }}" novalidate>
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" value="{{ name or '' }}" autocomplete="name">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password">
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password">
        </div>

        {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-alt">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
      </p>
    </div>
  </div>

</body>
</html>
