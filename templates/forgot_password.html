<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password · Queen's Lards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='Queen-Lards-Logo.png') }}">
</head>
<body class="auth-page">

  <div class="auth-back">
    <a href="{{ url_for('login') }}">&larr; Back to log in</a>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-sub">
        This starter site doesn't send real emails yet — wire this form up to
        an email service when you're ready, or just ask a family member to
        reset it for you for now.
      </p>
      <form method="POST" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
    </div>
  </div>

</body>
</html>
